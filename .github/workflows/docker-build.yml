name: Build and Push Backstage Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to build and push
        required: true
        type: string
  repository_dispatch:
    types: [backstage_release]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Backend
        run: |
          yarn tsc:full
          yarn build:all

      - name: Login to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: bot-env0
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./packages/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/env0/backstage:${{ github.event.client_payload.version || github.event.inputs.version }}
            ghcr.io/env0/backstage:latest