name: Build and Push Backstage Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to build and push
        required: true
        type: string
  repository_dispatch:
    types: [backstage_release]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.x'

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Backend
        run: |
          yarn tsc:full
          yarn build:all

      - name: Login to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: bot-env0
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./packages/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/env0/backstage:${{ github.event.client_payload.version || github.event.inputs.version }}
            ghcr.io/env0/backstage:latest