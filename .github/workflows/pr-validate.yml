name: PR Validation
on:
  pull_request:
    types:
      - "opened"
      - "edited"
      - "reopened"
      - "synchronize"
jobs:
  check-title:
    name: "PR Title"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check Title
        uses: gsactions/commit-message-checker@16fa2d5de096ae0d35626443bcd24f1e756cafee # v2
        with:
          pattern: '^.*(Feat|Chore|Fix):.*$'
          error: 'You need at least one of "Feat:|Chore:|Fix:" in PR title prefix.'
          excludeDescription: true
