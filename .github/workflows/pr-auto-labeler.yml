name: PR Auto Labeler
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-labeler:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - name: Labeler
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0 # Reads from .github/labeler.yml
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
